<!-- Modal Header -->
<div class="modal-header">
  <h4 *ngIf="plant == null" class="modal-title">Add a Plant to Your Garden</h4>
  <h4 *ngIf="plant != null" class="modal-title">Update this Plant</h4>

  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<!-- Modal Body -->
<div class="modal-body">
  <form [formGroup]="plantForm" (ngSubmit)="onSubmit()">
    <div *ngIf="!showNewType" class="mb-3">
      <label for="plantType" class="form-label">Plant Type</label>
      <select formControlName="plantType">
        <option value="">Select a type</option>
        <option *ngFor="let type of types" value="{{ type.id }}">{{ type.name }}</option>
      </select>
      <div *ngIf="plantForm.get('type')?.invalid && plantForm.get('type')?.touched" class="text-danger">
        Plant type is required.
      </div>
    </div>
      <button *ngIf="this.types.length > 0" type="button" class="btn stand-button" (click)="addType()">{{showNewType ? "Select Type" : "+ Add Type"}}</button>

     <div *ngIf="showNewType" class="mb-3">
      <label for="newType" class="form-label">New Type</label>
      <input type="text" id="newType" class="form-control" formControlName="newType" placeholder="Forb, Tree, Shrub...">
    </div>

    <div class="mb-3">
      <label for="commonName" class="form-label">Plant Name</label>
      <input type="text" id="name" class="form-control" formControlName="name" placeholder="e.g., Common Milkweed">
      <div *ngIf="plantForm.get('name')?.invalid && plantForm.get('name')?.touched" class="text-danger">
        Plant name is required.
      </div>
    </div>
   
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="sciName" class="form-label">Scientific Name (Optional)</label>
        <input type="text" id="sciName" class="form-control" formControlName="sciName">
      </div>
      <!-- <div class="col-md-6 mb-3">
        <label for="date-planted" class="form-label">Date Planted</label>
        <input type="date" id="date-planted" class="form-control" formControlName="datePlanted">
      </div> -->

    </div>

    <div *ngIf="showFlowerColor" class="mb-3">
      <label for="flowerColor" class="form-label">Flower Color</label>
      <input type="text" id="flowerColor" class="form-control" formControlName="flowerColor">
    </div>

     <div class="mb-3">
      <label for="description" class="form-label">Description (Optional)</label>
      <input type="text" id="description" class="form-control" formControlName="description">
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger mt-3">
      {{ errorMessage }}
    </div>
  </form>
</div>

<!-- Modal Footer -->
<div class="modal-footer">
  <button type="button" class="btn cancel-button button-font" (click)="activeModal.dismiss()">Cancel</button>
  <button type="submit" class="btn update-button button-font" (click)="onSubmit()" [disabled]="plantForm.invalid">{{(plant == null) ? "Add Plant" : "Update Plant"}}</button>

</div>
