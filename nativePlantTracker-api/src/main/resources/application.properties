
spring.application.name=nativePlantTracker-api
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Native_plants_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}


# Optional JPA settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
spring.jpa.show-sql=true

spring.jackson.serialization.fail-on-empty-beans=false

app.jwt-secret=${APP_JWT_SECRET:ZGVmYXVsdC1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXZlbG9wbWVudC1tdXN0LWJlLW92ZXJyaWRkZW4=}
app.jwt-expiration-milliseconds=86400000

server.port=${SERVER_PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
