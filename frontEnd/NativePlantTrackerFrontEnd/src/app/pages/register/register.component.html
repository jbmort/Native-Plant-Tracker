<form (ngSubmit)="onRegister()" #registerForm="ngForm" autocomplete="off">
  <div>
    <label for="username">Username:</label>
    <input
      type="text"
      id="username"
      name="username"
      [(ngModel)]="registrationData.username"
      minlength="6"
      required
      #username="ngModel" />
    <div *ngIf="username.invalid && username.touched" style="color:red">
      Username is required and must be at least 6 characters.
    </div>
  </div>

  <div>
    <label for="email">Email:</label>
    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="registrationData.email"
      required
      email
      #email="ngModel" />
    <div *ngIf="email.invalid && email.touched" style="color:red">
      A valid email is required.
    </div>
  </div>

  <div>
    <label for="password">Password:</label>
    <input
      type="password"
      id="password"
      name="password"
      [(ngModel)]="registrationData.password"
      required
      minlength="6"
      #password="ngModel" />
    <div *ngIf="password.invalid && password.touched" style="color:red">
      Password is required and must be at least 6 characters.
    </div>
  </div>

    <div>
    <label for="password2">Re-Enter Password:</label>
    <input
      type="password"
      id="password2"
      name="password2"
      [(ngModel)]="registrationData.password2"
      required
      minlength="6"
      #password2="ngModel" />
    <div *ngIf="!matchPasswords() && password2.touched" style="color:red">
      Passwords must match.
    </div>
  </div>

  <button type="submit" [disabled]="registerForm.invalid">Register</button>
</form>
