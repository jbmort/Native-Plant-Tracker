<div>
<h1>Log In</h1>
<br/>
<form (ngSubmit)="onSubmit()" #loginForm="ngForm" autocomplete="off">
  <div>
    <label for="username">Username:</label>
    <input 
      type="text" 
      id="username" 
      name="username" 
      [(ngModel)]="loginData.username" 
      required
      #username="ngModel"/>
    <div *ngIf="username.invalid && username.touched" style="color:red">
      Username is required.
    </div>
  </div>

  <div>
    <label for="password">Password:</label>
    <input 
      type="password" 
      id="password" 
      name="password" 
      [(ngModel)]="loginData.password" 
      required
      #password="ngModel"/>
    <div *ngIf="password.invalid && password.touched" style="color:red">
      Password is required.
    </div>
  </div>

   <div *ngIf="errorMessage" class="error-message" style="color:red">
    {{ errorMessage }}
  </div>

  <button type="submit" [disabled]="loginForm.invalid">Login</button>
    <a routerLink="/register"><button type="button" >Sign-Up</button></a>

</form>

</div>
